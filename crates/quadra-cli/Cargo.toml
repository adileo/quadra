[package]
name = "quadra-cli"
description = "The quadra command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "quadra"
path = "src/main.rs"

[dependencies]
quadra-server.workspace = true
quadra-api.workspace = true
chrono = "0.4"
quadra-syntax.workspace = true
quadra-sema.workspace = true
quadra-lsp.workspace = true
quadra-ir.workspace = true
quadra-types.workspace = true
quadra-analysis.workspace = true
quadra-runtime.workspace = true
quadra-store.workspace = true
quadra-qdi.workspace = true
codespan-reporting = "0.11"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
ignore = "0.4"
toml = { version = "0.9", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
calamine = "0.38"
rust_decimal = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

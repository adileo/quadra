[package]
name = "quadra-runtime"
description = "In-memory interpreter and test runner for Quadra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustc-hash = "1"
quadra-syntax.workspace = true
quadra-sema.workspace = true
quadra-ir.workspace = true
quadra-analysis.workspace = true
quadra-types.workspace = true
rust_decimal = "1"
serde_json = "1"
# XML documents of records `from xml` (MIT): read without a DTD, see `formats/xml.rs`
quick-xml = "0.42"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
# documents of `.qdp` files, rendered to PDF by an embedded Typst
quadra-print = { path = "../quadra-print" }
# labels (PDF and ZPL) and barcodes
quadra-label = { path = "../quadra-label" }
# signatures of documents (PAdES, CAdES, XAdES, OpenPGP)
quadra-sign = { path = "../quadra-sign" }
base64 = "0.22"
sha2 = "0.10"

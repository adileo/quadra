[package]
name = "quadra-print"
description = "Quadra's documents: a page layout rendered to PDF by an embedded Typst, the same bytes every time"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
sha2 = "0.10"

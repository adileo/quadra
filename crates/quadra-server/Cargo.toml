[package]
name = "quadra-server"
description = "HTTP API for Quadra: authenticated, idempotent, with optimistic concurrency"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
quadra-sema.workspace = true
quadra-syntax.workspace = true
quadra-ir.workspace = true
quadra-types.workspace = true
quadra-analysis.workspace = true
quadra-runtime = { workspace = true, features = ["pdf", "sign"] }
quadra-store.workspace = true
quadra-blobs.workspace = true
quadra-api.workspace = true
quadra-qdi.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
getrandom = "0.4"
chrono = "0.4"
rust_decimal = "1"
rust_xlsxwriter = { version = "0.104.0", features = ["chrono"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono-tz = "0.10"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs", "rsa"] }
russh-sftp = "3"
suppaftp = { version = "13", default-features = false, features = ["tokio-rustls-aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
aws-lc-rs = "1"
quick-xml = "0.42"
# the databases of other systems (transport/db.rs): each with TLS (rustls) unless `insecure`
tokio-postgres = { version = "0.7", default-features = false }
tokio-postgres-rustls = "0.14"
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "aws-lc-rs", "tls12"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
bytes = "1"
# ODBC (DB2 for i on the AS/400): needs unixODBC to build, so only where it runs (the agent)
odbc-api = { version = "30", default-features = false, features = ["odbc_version_3_80"], optional = true }

[features]
odbc = ["dep:odbc-api"]


[dev-dependencies]
rustls = "0.23"
tokio = { version = "1", features = ["test-util"] }
libunftp = { version = "0.25", default-features = false, features = ["aws_lc_rs"] }
unftp-sbe-fs = "0.4"
tokio-rustls = "0.26"
calamine = "0.38.0"
postgres = "0.19"
quadra-analysis.workspace = true

[package]
name = "quadra-server"
description = "HTTP API for Quadra: authenticated, idempotent, with optimistic concurrency"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
quadra-sema.workspace = true
quadra-syntax.workspace = true
quadra-ir.workspace = true
quadra-types.workspace = true
quadra-analysis.workspace = true
quadra-runtime.workspace = true
quadra-store.workspace = true
quadra-api.workspace = true
quadra-qdi.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
rust_decimal = "1"
rust_xlsxwriter = { version = "0.104.0", features = ["chrono"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono-tz = "0.10"
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs", "rsa"] }
russh-sftp = "3"
suppaftp = { version = "13", default-features = false, features = ["tokio-rustls-aws-lc-rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rustls-platform-verifier = "0.7"

[dev-dependencies]
rustls = "0.23"
libunftp = { version = "0.25", default-features = false, features = ["aws_lc_rs"] }
unftp-sbe-fs = "0.4"
tokio-rustls = "0.26"
calamine = "0.38.0"
quadra-analysis.workspace = true

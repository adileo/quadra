[package]
name = "quadra-ir"
description = "Intermediate representation of a Quadra program, shared by the type checker, analyses and interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rustc-hash = "1"
quadra-syntax.workspace = true
quadra-sema.workspace = true
rowan.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"

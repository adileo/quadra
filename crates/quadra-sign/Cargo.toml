[package]
name = "quadra-sign"
description = "Digital signatures for Quadra documents: PAdES, CAdES (.p7m), XAdES and OpenPGP, bytes in and bytes out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# ASN.1, X.509 and PKCS#8 structures (RustCrypto formats). CMS and PKCS#12 are
# read and written by this crate's own small BER/DER code (src/asn1.rs).
der = { version = "0.7.10", features = ["alloc", "oid"] }
spki = { version = "0.7.3", features = ["alloc"] }
x509-cert = "0.2.5"
pkcs8 = { version = "0.10.2", features = ["alloc"] }
pkcs5 = { version = "0.7.1", features = ["alloc", "pbes2", "3des", "sha1-insecure"] }
# Keys, digests and ciphers (RustCrypto).
rsa = { version = "0.9.10", features = ["sha2"] }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
sha2 = { version = "0.10.9", features = ["oid"] }
sha1 = "0.10.7"
hmac = "0.12.1"
pbkdf2 = { version = "0.12.2", features = ["hmac"] }
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
des = "0.8.1"
rc2 = "0.8.1"
# PDF cross-reference streams and object streams.
miniz_oxide = "0.8.9"
base64 = "0.22.1"
# OpenPGP (rPGP). Without default features: no bzip2.
pgp = { version = "0.21.1", default-features = false }
# Random session keys for OpenPGP encryption (the only randomness in this crate).
rand = "0.8.6"

[dev-dependencies]
miniz_oxide = "0.8.9"

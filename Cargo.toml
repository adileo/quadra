[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/adileo/quadra"
homepage = "https://quadra.run"

[workspace.dependencies]
rowan = "0.16"
quadra-syntax = { path = "crates/quadra-syntax" }
quadra-sema = { path = "crates/quadra-sema" }
quadra-lsp = { path = "crates/quadra-lsp" }
quadra-ir = { path = "crates/quadra-ir" }
quadra-types = { path = "crates/quadra-types" }
quadra-analysis = { path = "crates/quadra-analysis" }
# the PDF engine (Typst and its fonts, `pdf`) is turned on by the server and the CLI, not by
# the sandbox of the website
quadra-runtime = { path = "crates/quadra-runtime", default-features = false }
quadra-store = { path = "crates/quadra-store" }
quadra-server = { path = "crates/quadra-server" }
quadra-api = { path = "crates/quadra-api" }
quadra-qdi = { path = "crates/quadra-qdi" }
quadra-label = { path = "crates/quadra-label" }

# Debug builds: line tables only for our code (backtraces keep their lines), no debug
# information for dependencies. Full debug information made target/ grow past 50 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
